# 公网设备接入：8105 = MQTTS（TLS 在宝塔 nginx 的 stream 里终止）→ 明文转发 127.0.0.1:1883
#
# 放置位置：/www/server/panel/vhost/nginx/tcp/8105-mqtts.conf
#   —— 宝塔主配置 /www/server/nginx/conf/nginx.conf 第 7~13 行已有 `stream { include .../tcp/*.conf; }`，
#      所以这个文件**只写 server/upstream，不要再写 stream 外壳**。
#   —— 目录是 root:root 0700，写入要 sudo；改完必须 `nginx -t` 通过再 reload（改坏了 443 的 API 一起挂）。
#
# 为什么 TLS 终止在 nginx 而不是 RabbitMQ：
#   证书由宝塔签并自动续期（`/www/server/panel/vhost/cert/kuma.my-gun.top/{fullchain,privkey}.pem`，
#   实测 notAfter=2027-01-18），路径不变 → 续期后 `nginx -s reload` 就生效，RabbitMQ 不用挂证书、不用重启。
#   代价：**RabbitMQ 看到的对端 IP 全是 127.0.0.1**（连接日志/按 IP 限流在 MQ 侧失效），
#   所以这里用 nginx 层的 `limit_conn` + 独立访问日志把 IP 维度的保护补回来。
#   要真实对端 IP 或将来上 mTLS（设备证书）时，改成 RabbitMQ 自己的 ssl listener（见 Task-Server.md §8.1）。

# 单 IP 并发连接上限（Task-Server.md §8.7）。**故意给到 200 而不是 20**：
# 车队必然大量设备躲在运营商 CGNAT 后面共用出口 IP，限太小会直接把车挡在门外。
limit_conn_zone $binary_remote_addr zone=mqtts_conn:2m;

upstream kuma_mqtt_backend {
    server 127.0.0.1:1883;
}

server {
    listen 8105 ssl;
    listen [::]:8105 ssl;

    ssl_certificate     /www/server/panel/vhost/cert/kuma.my-gun.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kuma.my-gun.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MQTTS:1m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/mqtts-access.log tcp_format;   # tcp_format 在 stream 块里已定义

    limit_conn mqtts_conn 200;

    proxy_connect_timeout 5s;
    # 必须 > MQTT keepalive(60s) × 2，否则空闲长连接会被 nginx 掐断
    proxy_timeout 300s;
    proxy_pass kuma_mqtt_backend;
}
