# kuma 反代与 MQTTS 终结（放到 /etc/nginx/conf.d/kuma.conf；
# stream 段需 nginx 编译 stream 模块，或改由 haproxy 终结 TLS）
# 端口规划见 Task-Server.md §5：api 8100 仅本机，公网走这里；MQTTS 8105 → 1883

server {
    listen 443 ssl http2;
    server_name api.kuma.example.com;          # 待定域名（M0 未完成项）

    ssl_certificate     /etc/letsencrypt/live/api.kuma.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kuma.example.com/privkey.pem;

    client_max_body_size 20m;                  # 凭证/图片上传

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;               # WS 长连接
    }

    # 管理台与内部端点不对公网开放
    location /internal/ { return 404; }
    location = /docs    { return 404; }
}

server {
    listen 80;
    server_name api.kuma.example.com;
    return 301 https://$host$request_uri;
}

# MQTTS（TLS 终结后转明文 1883；证书续期由 certbot 管）
stream {
    server {
        listen 8105 ssl;
        proxy_pass 127.0.0.1:1883;
        ssl_certificate     /etc/letsencrypt/live/mqtt.kuma.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mqtt.kuma.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # 车端一机一密在 RabbitMQ HTTP auth 层校验，这里只做传输加密
    }
}
