# kuma RabbitMQ 配置（Task-Server.md §4.3）
# 内存水位用绝对值 300MB —— 不用 0.4 比例（0.4×3.9G=1.56G 在这台机器上等于自杀）
listeners.tcp.default = 5672
management.tcp.port = 15672
mqtt.listeners.tcp.default = 1883
# MQTT 客户端 CONNECT 包里的 host 字段为空时，插件默认落到 vhost `/`。
# 这台机器只建了 `/kuma`（没有 `/`）→ 认证直接 `Bad user name or password (134)`，
# 与口令无关（2026-10-20 实测：kuma_mq 与 guest 都 134）。显式映射到 /kuma。
mqtt_default_vhost = /kuma
vm_memory_high_watermark.absolute = 300MB
queue_master_locator = min-masters
log.console = true
log.console.level = warning
