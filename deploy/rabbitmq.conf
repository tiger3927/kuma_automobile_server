# kuma RabbitMQ 配置（Task-Server.md §4.3）
# 内存水位用绝对值 300MB —— 不用 0.4 比例（0.4×3.9G=1.56G 在这台机器上等于自杀）
listeners.tcp.default = 5672
management.tcp.port = 15672
mqtt.listeners.tcp.default = 1883
# MQTT vhost 映射（2026-10-20 实测，别再试下面这个键）：
#   MQTT 客户端 CONNECT 的 host 字段为空时，插件默认落到 vhost `/`；本机只建了 `/kuma`，
#   于是服务端日志报 `virtual host '/' does not exist`，客户端只看到
#   `Bad user name or password (134)` —— 与口令无关（kuma_mq 与 guest 都一样）。
#   ❌ `mqtt_default_vhost = /kuma`：RabbitMQ 4 直接拒绝未知变量
#      （`Conf file attempted to set unknown variable: mqtt_default_vhost` → BOOT FAILED，踩过）。
#   ✅ 用户名前缀映射：MQTT 用户名写 `/kuma:kuma_mq`（见 scripts/gen_systemd_env.sh），
#      AMQP 侧仍用裸 `kuma_mq`。
# ── MQTT 一机一密认证 + topic ACL（T1，2026-10-20 PoC）─────────────────────
# 顺序有讲究：internal 在前 → gateway 用的 kuma_mq 走 internal 库，api 挂了它照样连；
# 设备账号（用户名 = VIN）不在 internal 里 → 落到 http 后端，由 api 的
# /internal/mqtt-auth/<token>/{user,vhost,resource,topic} 判定（src/kuma/mqtt/auth.py）。
auth_backends.1 = internal
auth_backends.2 = http
auth_http.http_method = post
# token 由容器环境变量插值（docker-compose 的 KUMA_MQ_AUTH_TOKEN，来源 deploy/.env）。
# ⚠️ 这个文件在公开仓库里，密钥绝不能硬写进来；$( ) 未定义时插成空串 → 路径 404 → 设备全拒（fail closed）。
# ⚠️ 为什么走 https://域名 而不是 http://127.0.0.1:8100：
#   MQ 在容器里，它眼里的 127.0.0.1 是容器自己（2026-10-20 实测 failed_connect）；
#   而 api 只绑 127.0.0.1，主机 ufw 的 INPUT 策略是 DROP（只放行 22/80/443/888/8888/…），
#   容器直接够不到宿主 8100。走 443 → 宝塔 nginx → 127.0.0.1:8100 是**不需要改绑定、
#   不需要动防火墙、不需要新组件**的唯一通路。代价：多一跳 nginx，且 token 会进 nginx 访问日志。
#   正式服务器上自己管 nginx 后，改成容器网络内的明文地址 + 防火墙白名单更省。
auth_http.user_path = https://kuma.my-gun.top/internal/mqtt-auth/$(KUMA_MQ_AUTH_TOKEN)/user
auth_http.vhost_path = https://kuma.my-gun.top/internal/mqtt-auth/$(KUMA_MQ_AUTH_TOKEN)/vhost
auth_http.resource_path = https://kuma.my-gun.top/internal/mqtt-auth/$(KUMA_MQ_AUTH_TOKEN)/resource
auth_http.topic_path = https://kuma.my-gun.top/internal/mqtt-auth/$(KUMA_MQ_AUTH_TOKEN)/topic
auth_http.authorization_failure_disclosure = false
auth_http.connection_timeout = 3000
auth_http.request_timeout = 5000
# ⚠️ 生产必须叠 rabbitmq_auth_backend_cache：topic_path 在**每次 publish** 都要判一次
#    （1000 台 @5s ≈ 200 次/秒打 api）。PoC 实测后再启用（镜像自带该插件）。

vm_memory_high_watermark.absolute = 300MB
queue_master_locator = min-masters
log.console = true
log.console.level = warning
